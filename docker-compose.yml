services:
  crud_app_db:
    image: postgres:15
    container_name: crud_app_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - crud_app_data:/var/lib/postgresql/data

volumes:
  crud_app_data: